- aid: dailyhunt:shopping-catalog
  name: Dailyhunt E-Commerce Shopping Catalog API
  description: 'Lets a registered commerce vendor create a product catalog inside the Dailyhunt
    system and batch-submit CREATE/UPDATE/DELETE product rows against it, each carrying the standard
    product-feed attributes (price, sale window, availability, condition, category, size, colour,
    GTIN, inventory, images, shipping rows and Android/iPhone app links). Batches are asynchronous:
    the API returns a handle the vendor polls for completion and per-row errors. Authenticated with a
    vendor access token issued at registration.'
  humanURL: https://developer.dailyhunt.in/ads/docs/shopping-catalog/
  baseURL: https://money.dailyhunt.in/shopping-catalog/v1
