aid: dailyhunt
name: Dailyhunt
description: 'Dailyhunt is India''s largest local-language content and news aggregation platform,
  operated by VerSe Innovation (Bengaluru). It aggregates news, video, and short-form "DailyShare"
  cards from more than 600 publisher partners across fourteen Indian languages and distributes them
  through its own apps, mobile web and PWA, and — for approved partners — through a signed Content
  Syndication API that pushes the same catalogue into partner apps, OEM device home screens and
  browsers. Alongside syndication, Dailyhunt runs an advertising stack: the Dailyhunt Direct
  self-serve ad platform, a JavaScript Tracker SDK (with a Google Tag Manager path) for down-funnel
  conversion tracking on advertiser sites, and an E-Commerce Shopping Catalog API for vendors to
  batch-upload product feeds. VerSe Innovation also operates the Josh short-video app. API access is
  partner-gated: keys, secrets and partner codes are provisioned during onboarding rather than
  self-service, and the production feed host is not publicly resolvable.'
