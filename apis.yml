apis:
- aid: dailyhunt:content-syndication
  name: Dailyhunt Content Syndication API
  description: 'The partner-facing API that syndicates Dailyhunt''s editorial catalogue into a
    partner''s own app, browser, device home screen or PWA. It covers channel discovery (news,
    location, video and DailyShare/viral channels), paginated content fetch for a channel''s cards,
    keyword search, the supported-language list, card feedback capture, live cricket score and
    commentary streaming, and a view-tracking callback. Every request is signed with a Base64
    HMAC-SHA1 signature over the sorted query string plus the HTTP method, using a secret key issued
    at onboarding, and carries a per-user partner id (puid). Advanced surfaces are gated behind a
    per-partner feature mask.'
  humanURL: https://api-syndication.dailyhunt.in/
  baseURL: http://feed.dailyhunt.in/api/v2/syndication
